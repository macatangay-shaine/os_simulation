name: Backend Validation

on:
  push:
    branches:
      - main
      - feature/db-migration
  pull_request:

jobs:
  validate-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: GitHub secret DATABASE_URL is not configured for this repository/environment."
            echo "Set it in Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Run deployment validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/validate_postgres.py

      - name: Compile backend modules
        run: python -m compileall .