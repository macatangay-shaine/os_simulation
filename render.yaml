services:
  - type: web
    name: jezos-backend
    runtime: python
    runtimeVersion: 3.12
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0 main:app
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
